# Update OPENAI_API_KEY below with your real key, then:
#   kubectl apply -f kind/manifests/secrets.yaml
#   kubectl rollout restart deployment/triage-dashboard -n incident-triage
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: incident-triage
type: Opaque
stringData:
  DB_USER: triage_user
  DB_PASSWORD: triage_pass_123
  POSTGRES_USER: triage_user
  POSTGRES_PASSWORD: triage_pass_123
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-api-key
  namespace: incident-triage
type: Opaque
stringData:
  OPENAI_API_KEY: ##### your openai api key #####