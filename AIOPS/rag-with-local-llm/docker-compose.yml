services:
  chroma:
    image: chromadb/chroma:0.5.11
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling chat model (gemma2)..."
        ollama pull gemma2:2b
        echo "Pulling embedding model..."
        ollama pull nomic-embed-text
        echo "Ollama models ready."
    restart: "no"

  api:
    build: .
    ports:
      - "8081:8080"
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=gemma2:2b
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
    depends_on:
      chroma:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./sample_docs:/app/sample_docs:ro

volumes:
  chroma_data:
  ollama_data:
