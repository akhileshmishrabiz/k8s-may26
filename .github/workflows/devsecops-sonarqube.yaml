name: DevSecOps SonarQube
# Scan the Flask portal against self-hosted SonarQube on EC2.
#
# Repo Settings → Secrets and variables → Actions
#   Secret   SONAR_TOKEN      = User Token from SonarQube (My Account → Security)
#   Secret   SONAR_HOST_URL   = http://<ec2-public-ip>:9000   (no trailing slash)
# Variables with the same names also work.
#
# sonar-project.properties lives at devsecops/src (project key: studnet-portal)

on:
  # pull_request:
  #   paths:
  #     - 'devsecops/src/**'
  #     - '.github/workflows/devsecops-sonarqube.yaml'
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'devsecops/src/**'
  #     - '.github/workflows/devsecops-sonarqube.yaml'

  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  CODE_PATH: devsecops/src
  SONAR_PROJECT_KEY: studnet-portal

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || vars.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}

    steps:
      - name: Check SONAR_TOKEN and SONAR_HOST_URL
        run: |
          TOKEN="$(printf '%s' "${SONAR_TOKEN}" | tr -d '[:space:]')"
          URL="$(printf '%s' "${SONAR_HOST_URL}" | tr -d '[:space:]')"
          URL="${URL%/}"

          if [ -z "${URL}" ]; then
            echo "::error::SONAR_HOST_URL is empty. Add a repository secret (or variable) named SONAR_HOST_URL = http://<ec2-public-ip>:9000 with no trailing slash."
            exit 1
          fi
          if [ -z "${TOKEN}" ]; then
            echo "::error::SONAR_TOKEN is empty. That causes HTTP 401. Add a Repository secret named SONAR_TOKEN (Secrets tab, not an Environment secret)."
            exit 1
          fi

          echo "SONAR_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"
          echo "SONAR_HOST_URL=${URL}" >> "${GITHUB_ENV}"
          echo "SONAR_HOST_URL=${URL}"
          echo "SONAR_TOKEN length=${#TOKEN} prefix=${TOKEN:0:4}"

          if ! curl -fsS --max-time 15 "${URL}/api/system/status"; then
            echo "::error::Cannot reach ${URL}. Confirm SonarQube is UP and security group allows inbound TCP 9000 from GitHub-hosted runners."
            exit 1
          fi
          echo

          HTTP_CODE="$(curl -sS -o /tmp/sonar-auth.json -w "%{http_code}" \
            --max-time 20 \
            -u "${TOKEN}:" \
            "${URL}/api/authentication/validate" || true)"
          echo "GET /api/authentication/validate → HTTP ${HTTP_CODE}"
          cat /tmp/sonar-auth.json || true
          echo

          if [ "${HTTP_CODE}" != "200" ] || ! grep -q '"valid":true' /tmp/sonar-auth.json; then
            echo "::error::SonarQube rejected SONAR_TOKEN (HTTP ${HTTP_CODE}). Generate a User Token in SonarQube (My Account → Security) and paste only the token into the GitHub secret."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Unit tests with coverage
        env:
          DB_LINK: "sqlite:///:memory:"
        working-directory: ${{ env.CODE_PATH }}
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pytest --cov=app --cov-report=xml --cov-report=term-missing
          test -f coverage.xml

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          projectBaseDir: ${{ env.CODE_PATH }}
          args: >
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: SonarQube quality gate
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          scanMetadataReportFile: ${{ env.CODE_PATH }}/.scannerwork/report-task.txt
          pollingTimeoutSec: 600
